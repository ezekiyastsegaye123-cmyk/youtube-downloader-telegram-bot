services:
  # Self-hosted Telegram Bot API Server (Enables uploads up to 2000 MB / 2 GB)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api-server
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_STAT: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./downloads:/var/lib/telegram-bot-api/downloads
    ports:
      - "8081:8081"

  # YouTube Downloader Telegram Bot
  telegram-bot:
    build: .
    container_name: yt-downloader-bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      TELEGRAM_API_URL: http://telegram-bot-api:8081/bot
      MAX_FILE_SIZE_MB: 2000
    volumes:
      - ./downloads:/app/downloads
      # Optional: uncomment if you have a cookies.txt file for anti-bot bypass
      # - ./cookies.txt:/app/cookies.txt:ro

volumes:
  telegram-bot-api-data:
